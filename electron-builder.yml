appId: app.kamapathy.browser
productName: Kamapathy
copyright: Copyright (c) 2026 Kamapathy contributors
asar: true
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - LICENSE
  # The PDF reader needs no canvas, so its native build stays out.
  - "!**/node_modules/@napi-rs/**"
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico
  - from: skills/kamapathy
    to: skills/kamapathy
    filter:
      - "**/*"
      - "!**/.DS_Store"
  - from: node_modules/pdfjs-dist/cmaps
    to: pdfjs-cmaps
publish: null
# NSIS ignores protocols; Windows registers through build/installer.nsh.
protocols:
  - name: Web site URL
    schemes:
      - http
      - https
    role: Viewer
# Any link can start Kamapathy with arguments.
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  darkModeSupport: true
  identity: "-"
  hardenedRuntime: false
  notarize: false
  target:
    - dmg
    - zip
  artifactName: Kamapathy-${version}-mac-${arch}.${ext}
  extendInfo:
    NSCameraUsageDescription: Websites you allow can use the camera.
    NSMicrophoneUsageDescription: Websites you allow can use the microphone.
    CFBundleDocumentTypes:
      - CFBundleTypeName: Web content and documents
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.html
          - public.xhtml
          - public.svg-image
          - com.adobe.pdf
          - public.png
          - public.jpeg
          - com.compuserve.gif
          - org.webmproject.webp
          - public.avif
          - public.plain-text
          - org.webmproject.webm
dmg:
  title: Kamapathy
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  artifactName: Kamapathy-${version}-windows-${arch}.${ext}
nsis:
  artifactName: Kamapathy-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Kamapathy
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
portable:
  artifactName: Kamapathy-${version}-windows-${arch}-portable.${ext}
linux:
  executableName: kamapathy-browser
  syncDesktopName: true
  icon: build/icon.png
  category: Network
  synopsis: A calm browser you share with your agents
  description: Browse with tabs across the top, spaces that share or separate sign-ins, split view, and a local agent API.
  maintainer: Kamapathy contributors
  vendor: Kamapathy contributors
  target:
    - AppImage
    - deb
  artifactName: Kamapathy-${version}-linux-${arch}.${ext}
  mimeTypes:
    - text/html
    - application/xhtml+xml
    - image/svg+xml
    - application/pdf
    - image/png
    - image/jpeg
    - image/gif
    - image/webp
    - image/avif
    - text/plain
    - video/webm
  desktop:
    entry:
      Name: Kamapathy
      Comment: A little more room to think
      Categories: Network;WebBrowser;
      Keywords: browser;web;spaces;automation;
      StartupWMClass: app.kamapathy.browser
      Terminal: "false"
