name: Build desktop apps

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            platform: mac
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            platform: mac
            arch: x64
          - name: Windows x64
            os: windows-2022
            platform: win
            arch: x64
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux
            arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate types, behavior, and copy
        run: npm run check
      - name: Compile desktop app
        run: npm run build
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libxtst6 libsecret-1-0 libfuse2
      - name: Test install scripts
        run: npm run test:install
      - name: Smoke test desktop on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Verify native Kamapathy identity on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:branding
      - name: Verify native Kamapathy identity on macOS and Windows
        if: runner.os != 'Linux'
        run: npm run test:branding
      - name: Smoke test desktop on macOS and Windows
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Test Kamapathy skill on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:skill
      - name: Test Kamapathy skill on macOS and Windows
        if: runner.os != 'Linux'
        run: npm run test:skill
      - name: Test a normal desktop launch on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:native
      - name: Test a normal desktop launch on macOS and Windows
        if: runner.os != 'Linux'
        run: npm run test:native
      - name: Decide signing
        id: signing
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PLATFORM: ${{ matrix.platform }}
          MAC_SECRETS: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
          WINDOWS_SECRETS: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' }}
        run: |
          # Only pushes and dispatches on main sign, and only with every secret
          # the platform needs. Linux builds are never signed.
          signed=false
          if { [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; } && [ "$REF" = refs/heads/main ]; then
            if [ "$PLATFORM" = mac ] && [ "$MAC_SECRETS" = true ]; then signed=true; fi
            if [ "$PLATFORM" = win ] && [ "$WINDOWS_SECRETS" = true ]; then signed=true; fi
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
      - name: Package native desktop app
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          CSC_LINK: ${{ steps.signing.outputs.signed == 'true' && matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ steps.signing.outputs.signed == 'true' && matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ steps.signing.outputs.signed == 'true' && matrix.platform == 'mac' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ steps.signing.outputs.signed == 'true' && matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.signing.outputs.signed == 'true' && matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          AZURE_TENANT_ID: ${{ steps.signing.outputs.signed == 'true' && matrix.platform == 'win' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ steps.signing.outputs.signed == 'true' && matrix.platform == 'win' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.signing.outputs.signed == 'true' && matrix.platform == 'win' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          # Unsigned builds, pull requests included, stay ad hoc and get no
          # signing variables at all.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            [ -n "${!name}" ] || unset "$name"
          done
          set --
          if [ "$SIGNED" = true ]; then
            set -- --config electron-builder.signed.yml
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            # Notarization reads the App Store Connect key from a file.
            if [ -n "${APPLE_API_KEY:-}" ]; then
              key="$RUNNER_TEMP/apple-api-key.p8"
              (umask 077 && printf '%s\n' "$APPLE_API_KEY" > "$key")
              export APPLE_API_KEY="$key"
            fi
          fi
          npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never "$@"
      - name: Verify signatures
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            for app in release/mac*/Kamapathy.app; do
              codesign --verify --deep --strict --verbose=2 "$app"
              spctl --assess --type execute --verbose=2 "$app"
            done
            # The notarization ticket is stapled to the app each disk image holds.
            for dmg in release/*.dmg; do
              volume=$(mktemp -d)
              hdiutil attach -nobrowse -readonly -mountpoint "$volume" "$dmg"
              xcrun stapler validate "$volume/Kamapathy.app"
              hdiutil detach "$volume"
            done
          else
            script="$RUNNER_TEMP/verify-signatures.ps1"
            cat > "$script" <<'EOF'
          $files = @(Get-ChildItem release -File | Where-Object { $_.Name -like '*-setup.exe' -or $_.Name -like '*-portable.exe' })
          if ($files.Count -ne 2) { throw "Expected two installers, found $($files.Count)." }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name): $($signature.Status) $($signature.StatusMessage)" }
            Write-Output "$($file.Name): $($signature.SignerCertificate.Subject)"
          }
          EOF
            pwsh -NoProfile -NonInteractive -File "$script"
          fi
      - name: Verify bundled skill
        run: node scripts/check-bundled-skill.mjs
      - name: Verify packaged registrations
        run: node scripts/test-branding.mjs --packaged
      - name: Upload installable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kamapathy-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
